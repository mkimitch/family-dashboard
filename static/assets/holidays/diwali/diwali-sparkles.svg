<svg id="diwali-reduced-motion" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="diwali-svg diwali-sparkles"
	overflow="hidden">
	<style>
		/* Explicit static image target for browsers caching SVG motion preferences. */
		:root:target {
			--diwali-motion: paused;
		}

		* {
			animation-play-state: var(--diwali-motion, running) !important;
		}

		.diwali-sparkles {
			--diwali-gold: oklch(0.88 0.13 86.06);
			--diwali-saffron: oklch(0.78 0.17 66.2);
			--sparkle-opacity: 0.85;
		}

		.sparkles-root {
			opacity: var(--sparkle-opacity);
		}

		.sparkle-mote {
			animation: sparkle-float-up var(--dur, 6s) linear var(--delay, 0s) infinite;
			opacity: 0;
			transform-box: fill-box;
			transform-origin: center;
			will-change: transform, opacity;
		}

		@keyframes sparkle-float-up {
			0% {
				opacity: 0;
				transform: translate3d(0px, 8px, 0) scale(calc(var(--scale, 1) * 0.45)) rotate(0deg);
			}

			20% {
				opacity: var(--peak-opacity, 0.9);
				transform: translate3d(calc(var(--arc, 0px) * 0.18),
						calc(var(--rise, -72px) * 0.2),
						0) scale(calc(var(--scale, 1) * 0.9)) rotate(calc(var(--rot, 0deg) * 0.25));
			}

			50% {
				opacity: var(--peak-opacity, 0.9);
				transform: translate3d(calc(var(--arc, 0px) * 0.55),
						calc(var(--rise, -72px) * 0.52),
						0) scale(var(--scale, 1)) rotate(calc(var(--rot, 0deg) * 0.6));
			}

			80% {
				opacity: calc(var(--peak-opacity, 0.9) * 0.52);
				transform: translate3d(calc(var(--arc, 0px) * 0.85),
						calc(var(--rise, -72px) * 0.82),
						0) scale(calc(var(--scale, 1) * 0.78)) rotate(calc(var(--rot, 0deg) * 0.85));
			}

			100% {
				opacity: 0;
				transform: translate3d(var(--arc, 0px), var(--rise, -72px), 0) scale(calc(var(--scale, 1) * 0.3)) rotate(var(--rot, 0deg));
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.sparkle-mote {
				animation: none !important;
				opacity: 0.55 !important;
				transform: scale(var(--scale, 0.85)) !important;
			}
		}
	</style>
	<defs>
		<radialGradient id="sparkle-mote-grad" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="oklch(0.978 0.035 97.54)" />
			<stop offset="45%" stop-color="oklch(0.88 0.13 86.06)" stop-opacity=".75" />
			<stop offset="100%" stop-color="oklch(0.78 0.17 66.2)" stop-opacity="0" />
		</radialGradient>
		<circle id="sparkle-orb-unit" cx="0" cy="0" r="4.2" fill="url(#sparkle-mote-grad)" />
		<path id="sparkle-star-unit" fill="var(--diwali-gold)"
			d="m0-5.5 1.3 4.2L5.5 0 1.3 1.3 0 5.5l-1.3-4.2L-5.5 0l4.2-1.3Z" />
	</defs>
	<g class="sparkles-root">
		<svg x="14%" y="93%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:4.8s;--delay:-0.7s;--rise:-84px;--arc:16px;--scale:0.95" />
		</svg>
		<svg x="27%" y="95%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:3.7s;--delay:-2.1s;--rise:-76px;--arc:0px;--scale:0.8" />
		</svg>
		<svg x="41%" y="94%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:6.4s;--delay:-4.2s;--rise:-96px;--arc:-18px;--scale:0.9" />
		</svg>
		<svg x="58%" y="95%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:4.1s;--delay:-1.3s;--rise:-82px;--arc:14px;--scale:0.85" />
		</svg>
		<svg x="73%" y="94%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:7.5s;--delay:-5.6s;--rise:-92px;--arc:0px;--scale:0.9" />
		</svg>
		<svg x="86%" y="93%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:5.2s;--delay:-2.9s;--rise:-86px;--arc:-16px;--scale:0.95" />
		</svg>
		<svg x="18%" y="76%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-star-unit"
				style="--dur:6.8s;--delay:-3.4s;--rise:-78px;--arc:20px;--scale:0.72;--rot:38deg" />
		</svg>
		<svg x="33%" y="80%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:4.3s;--delay:-1.1s;--rise:-64px;--arc:-12px;--scale:0.75" />
		</svg>
		<svg x="67%" y="78%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:5.7s;--delay:-4.0s;--rise:-68px;--arc:12px;--scale:0.75" />
		</svg>
		<svg x="82%" y="75%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-star-unit"
				style="--dur:8.3s;--delay:-1.8s;--rise:-80px;--arc:-20px;--scale:0.7;--rot:-36deg" />
		</svg>
		<svg x="13%" y="58%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:4.9s;--delay:-3.7s;--rise:-62px;--arc:0px;--scale:0.7" />
		</svg>
		<svg x="25%" y="62%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:9.1s;--delay:-6.2s;--rise:-74px;--arc:15px;--scale:0.78" />
		</svg>
		<svg x="75%" y="60%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:3.9s;--delay:-0.5s;--rise:-66px;--arc:-14px;--scale:0.74" />
		</svg>
		<svg x="87%" y="56%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:6.1s;--delay:-4.4s;--rise:-60px;--arc:0px;--scale:0.68" />
		</svg>
		<svg x="20%" y="38%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-star-unit"
				style="--dur:4.5s;--delay:-2.0s;--rise:-54px;--arc:12px;--scale:0.68;--rot:28deg" />
		</svg>
		<svg x="34%" y="33%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:7.9s;--delay:-5.1s;--rise:-48px;--arc:0px;--scale:0.64" />
		</svg>
		<svg x="66%" y="34%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-orb-unit"
				style="--dur:3.8s;--delay:-2.5s;--rise:-48px;--arc:0px;--scale:0.64" />
		</svg>
		<svg x="80%" y="38%" overflow="visible">
			<use class="sparkle-mote" href="#sparkle-star-unit"
				style="--dur:5.5s;--delay:-3.9s;--rise:-54px;--arc:-12px;--scale:0.68;--rot:-28deg" />
		</svg>
	</g>
</svg>
<svg id="diwali-reduced-motion" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="100%" height="100%"
	preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false" class="diwali-svg diwali-diyas-row">
	<style>
		/* Explicit static image target for browsers caching SVG motion preferences. */
		:root:target {
			--diwali-motion: paused;
		}

		* {
			animation-play-state: var(--diwali-motion, running) !important;
		}

		.diwali-diyas-row {
			--diwali-amber: oklch(0.78 0.17 66.2);
			--diwali-gold: oklch(0.88 0.13 86.06);
			--diwali-magenta: oklch(0.59 0.22 2.03);
			--diwali-marigold: oklch(0.838 0.169 83.34);
			--diwali-plum: oklch(0.31 0.11 301.37);
			--diwali-vermilion: oklch(0.61 0.21 22.24);
			--diya-glow-opacity: 0.85;
		}

		.flame-1,
		.flame-2,
		.flame-3,
		.flame-4,
		.flame-5 {
			transform-box: fill-box;
			transform-origin: 50% 92%;
		}

		.flame-1 {
			animation: flame-dance-a 2.3s ease-in-out infinite;
		}

		.flame-2 {
			animation: flame-dance-b 3.1s ease-in-out infinite -0.7s;
		}

		.flame-3 {
			animation: flame-dance-hero 2.7s ease-in-out infinite -1.3s;
		}

		.flame-4 {
			animation: flame-dance-a 1.9s ease-in-out infinite -0.4s;
		}

		.flame-5 {
			animation: flame-dance-b 3.4s ease-in-out infinite -2.1s;
		}

		.halo-1 {
			animation: halo-breathe 2.3s ease-in-out infinite;
		}

		.halo-2 {
			animation: halo-breathe 3.1s ease-in-out infinite -0.7s;
		}

		.halo-3 {
			animation: halo-breathe 2.7s ease-in-out infinite -1.3s;
		}

		.halo-4 {
			animation: halo-breathe 1.9s ease-in-out infinite -0.4s;
		}

		.halo-5 {
			animation: halo-breathe 3.4s ease-in-out infinite -2.1s;
		}

		@keyframes flame-dance-a {

			0%,
			100% {
				transform: scale(1, 1) skewX(0deg);
			}

			25% {
				transform: scale(0.95, 1.06) skewX(-2.2deg);
			}

			55% {
				transform: scale(1.04, 0.96) skewX(1.8deg);
			}

			80% {
				transform: scale(0.98, 1.04) skewX(-1deg);
			}
		}

		@keyframes flame-dance-b {

			0%,
			100% {
				transform: scale(1, 1) skewX(0deg);
			}

			33% {
				transform: scale(1.04, 0.95) skewX(2.4deg);
			}

			66% {
				transform: scale(0.96, 1.07) skewX(-1.8deg);
			}
		}

		@keyframes flame-dance-hero {

			0%,
			100% {
				transform: scale(1, 1) skewX(0deg);
			}

			30% {
				transform: scale(0.96, 1.08) skewX(1.6deg);
			}

			60% {
				transform: scale(1.03, 0.96) skewX(-2deg);
			}

			85% {
				transform: scale(0.99, 1.03) skewX(0.8deg);
			}
		}

		@keyframes halo-breathe {

			0%,
			100% {
				opacity: calc(var(--diya-glow-opacity) * 0.76);
			}

			50% {
				opacity: var(--diya-glow-opacity);
			}
		}

		@media (prefers-reduced-motion: reduce) {

			.flame-1,
			.flame-2,
			.flame-3,
			.flame-4,
			.flame-5,
			.halo-1,
			.halo-2,
			.halo-3,
			.halo-4,
			.halo-5 {
				animation: none !important;
			}
		}
	</style>
	<defs>
		<!-- Soft elliptical radial horizon glow (cx=50% cy=95% rx=50% ry=65%) -->
		<radialGradient id="horizon-warm-wash" cx="50%" cy="95%" rx="50%" ry="65%">
			<stop offset="0%" stop-color="oklch(0.78 0.17 66.2)" stop-opacity="0.32" />
			<stop offset="52%" stop-color="oklch(0.59 0.22 2.03)" stop-opacity="0.1" />
			<stop offset="100%" stop-color="oklch(0.31 0.11 301.37)" stop-opacity="0" />
		</radialGradient>
		<!-- Horizontal edge-fade mask (0% transparent -> 14% opaque -> 86% opaque -> 100% transparent) -->
		<linearGradient id="edge-fade-grad" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="oklch(1 0 0)" stop-opacity="0" />
			<stop offset="14%" stop-color="oklch(1 0 0)" stop-opacity="1" />
			<stop offset="86%" stop-color="oklch(1 0 0)" stop-opacity="1" />
			<stop offset="100%" stop-color="oklch(1 0 0)" stop-opacity="0" />
		</linearGradient>
		<mask id="horizontal-edge-fade" maskContentUnits="objectBoundingBox">
			<rect x="0" y="0" width="1" height="1" fill="url(#edge-fade-grad)" />
		</mask>
		<radialGradient id="diya-flame-halo" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="oklch(0.88 0.13 86.06)" stop-opacity="0.65" />
			<stop offset="45%" stop-color="oklch(0.78 0.17 66.2)" stop-opacity="0.25" />
			<stop offset="100%" stop-color="oklch(0.61 0.21 22.24)" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="surface-reflection" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="oklch(0.88 0.13 86.06)" stop-opacity="0.5" />
			<stop offset="55%" stop-color="oklch(0.78 0.17 66.2)" stop-opacity="0.18" />
			<stop offset="100%" stop-color="oklch(0.31 0.11 301.37)" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="clay-bowl-main" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="oklch(0.61 0.21 22.24)" />
			<stop offset="55%" stop-color="oklch(0.5 0.19 17.08)" />
			<stop offset="100%" stop-color="oklch(0.3 0.09 340.69)" />
		</linearGradient>
		<linearGradient id="clay-bowl-side" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="oklch(0.59 0.22 2.03)" />
			<stop offset="60%" stop-color="oklch(0.43 0.16 350.29)" />
			<stop offset="100%" stop-color="oklch(0.31 0.11 301.37)" />
		</linearGradient>
		<linearGradient id="flame-outer-grad" x1="0%" y1="100%" x2="0%" y2="0%">
			<stop offset="0%" stop-color="oklch(0.61 0.21 22.24)" />
			<stop offset="35%" stop-color="oklch(0.78 0.17 66.2)" />
			<stop offset="80%" stop-color="oklch(0.88 0.13 86.06)" />
			<stop offset="100%" stop-color="oklch(0.978 0.035 97.54)" />
		</linearGradient>
		<g id="diya-flame-unit">
			<path d="M 0,2 C -9,-4 -10,-18 0,-30 C 10,-18 9,-4 0,2 Z" fill="url(#flame-outer-grad)" />
			<path d="M 0,1 C -5,-3 -5,-14 0,-22 C 5,-14 5,-3 0,1 Z" fill="oklch(0.88 0.13 86.06)" />
			<path d="M 0,0 C -2.5,-2 -2.5,-9 0,-14 C 2.5,-9 2.5,-2 0,0 Z" fill="oklch(1 0 0)" />
		</g>
		<g id="diya-bowl-standard">
			<ellipse cx="0" cy="22" rx="28" ry="5.5" fill="url(#surface-reflection)" />
			<ellipse cx="0" cy="18" rx="11" ry="3" fill="oklch(0.78 0.17 66.2)" opacity="0.75" />
			<path d="M -22,0 C -20,13 -11,18 0,18 C 11,18 20,13 22,0 Z" fill="url(#clay-bowl-side)"
				stroke="var(--diwali-gold)" stroke-width="1" />
			<ellipse cx="0" cy="0" rx="22" ry="4.2" fill="oklch(0.32 0.1 355.2)" stroke="var(--diwali-gold)"
				stroke-width="1.1" />
			<ellipse cx="0" cy="0.5" rx="18" ry="2.8" fill="oklch(0.78 0.17 66.2)" opacity="0.65" />
			<path d="M -16,7 Q -8,13 0,7 Q 8,13 16,7" fill="none" stroke="var(--diwali-gold)" stroke-width="1"
				stroke-opacity="0.85" />
			<circle cx="-8" cy="11" r="1.2" fill="var(--diwali-gold)" />
			<circle cx="0" cy="12" r="1.4" fill="var(--diwali-gold)" />
			<circle cx="8" cy="11" r="1.2" fill="var(--diwali-gold)" />
		</g>
	</defs>
	<!-- Horizon wash & ground line feathered smoothly to 0 opacity on left, right, and top -->
	<g mask="url(#horizontal-edge-fade)">
		<rect x="0" y="12" width="320" height="84" fill="url(#horizon-warm-wash)" />
	</g>
	<!-- Far-left and far-right diyas shifted inward (x=44 and x=276) so r=32 halos never clip -->
	<g id="diya-far-left" transform="translate(44, 68) scale(0.76)">
		<circle class="halo-1" cx="0" cy="-14" r="32" fill="url(#diya-flame-halo)" />
		<use href="#diya-bowl-standard" />
		<g class="flame-1">
			<use href="#diya-flame-unit" />
		</g>
	</g>
	<g id="diya-mid-left" transform="translate(98, 66) scale(0.9)">
		<circle class="halo-2" cx="0" cy="-14" r="36" fill="url(#diya-flame-halo)" />
		<use href="#diya-bowl-standard" />
		<g class="flame-2">
			<use href="#diya-flame-unit" />
		</g>
	</g>
	<g id="diya-mid-right" transform="translate(222, 66) scale(0.9)">
		<circle class="halo-4" cx="0" cy="-14" r="36" fill="url(#diya-flame-halo)" />
		<use href="#diya-bowl-standard" />
		<g class="flame-4">
			<use href="#diya-flame-unit" />
		</g>
	</g>
	<g id="diya-far-right" transform="translate(276, 68) scale(0.76)">
		<circle class="halo-5" cx="0" cy="-14" r="32" fill="url(#diya-flame-halo)" />
		<use href="#diya-bowl-standard" />
		<g class="flame-5">
			<use href="#diya-flame-unit" />
		</g>
	</g>
	<g id="diya-center-hero" transform="translate(160, 64)">
		<circle class="halo-3" cx="0" cy="-16" r="46" fill="url(#diya-flame-halo)" />
		<ellipse cx="0" cy="25" rx="38" ry="7" fill="url(#surface-reflection)" />
		<ellipse cx="0" cy="20" rx="14" ry="3.5" fill="var(--diwali-gold)" opacity="0.85" />
		<path d="M -28,0 C -26,15 -14,21 0,21 C 14,21 26,15 28,0 Z" fill="url(#clay-bowl-main)" stroke="var(--diwali-gold)"
			stroke-width="1.3" />
		<ellipse cx="0" cy="0" rx="28" ry="5" fill="oklch(0.3 0.09 340.69)" stroke="var(--diwali-gold)"
			stroke-width="1.3" />
		<ellipse cx="0" cy="0.6" rx="23" ry="3.4" fill="oklch(0.78 0.17 66.2)" opacity="0.75" />
		<path d="M -21,7 Q -10,15 0,8 Q 10,15 21,7" fill="none" stroke="var(--diwali-gold)" stroke-width="1.2" />
		<polygon points="0,3 3,9 0,15 -3,9" fill="var(--diwali-gold)" />
		<circle cx="-11" cy="12" r="1.5" fill="var(--diwali-gold)" />
		<circle cx="11" cy="12" r="1.5" fill="var(--diwali-gold)" />
		<g class="flame-3" transform="scale(1.15)">
			<use href="#diya-flame-unit" />
		</g>
	</g>
</svg>